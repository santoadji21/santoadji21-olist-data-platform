# Satu berkas untuk laptop (IDE/plugin) dan container Airflow: koneksi dari environment, dengan default untuk laptop.
#   laptop    : host localhost, port 15432 (default di bawah)
#   container : host postgres, port 5432 (DBT_PG_HOST / DBT_PG_PORT diset di docker-compose.yml)
# Password TIDAK punya default: harus datang dari environment (V2_PG_PASSWORD di .env).
olist_v2:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_PG_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PG_PORT', '15432') | as_number }}"
      user: "{{ env_var('DBT_PG_USER', 'olist') }}"
      password: "{{ env_var('DBT_PG_PASSWORD') }}"
      dbname: "{{ env_var('DBT_PG_DBNAME', 'olist_dw') }}"
      schema: staging
      threads: 4
