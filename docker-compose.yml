# Olist Data Platform (Tugas Besar) — stack yang sama dengan Local Big Data Lab (Pertemuan 9),
# diberi nama project sendiri supaya tidak bentrok dengan lab latihan.
#
#   postgres ──┐
#   kafka ─────┼──> jupyter        kafka ──> kafka-ui
#   minio ─────┘
#
# Jalankan:  python pipeline.py init && python pipeline.py up

name: olist

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: ${REGISTRY:-docker.io}/library/postgres:16-alpine
    container_name: olist-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=32MB", "-c", "max_wal_size=2GB"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.5" }
    logging: *default-logging
    networks: [lab]

  kafka:
    image: ${REGISTRY:-docker.io}/apache/kafka:3.9.0
    container_name: olist-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Dua listener: PLAINTEXT untuk container lain (kafka:9092), PLAINTEXT_HOST untuk laptop (localhost:29092).
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP:--Xmx512m -Xms512m}
      CLUSTER_ID: olistplatform-00000000000
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.5" }
    logging: *default-logging
    networks: [lab]

  kafka-ui:
    image: ${KAFKA_UI_IMAGE:-kafbat/kafka-ui:v1.3.0}
    container_name: olist-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: olist
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }
    logging: *default-logging
    networks: [lab]

  minio:
    # minio/minio sudah ditarik dari Docker Hub; bitnamilegacy = build terakhir (API S3 sama, tanpa web console).
    image: ${REGISTRY:-docker.io}/bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: olist-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKETS:-bronze,silver,gold}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }
    logging: *default-logging
    networks: [lab]

  jupyter:
    image: ${JUPYTER_IMAGE:-olist/jupyter:local}
    build: ./jupyter
    container_name: olist-jupyter
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-olist}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KAFKA_BOOTSTRAP: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./outputs:/home/jovyan/outputs
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/api > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }
    logging: *default-logging
    networks: [lab]

networks:
  lab:
    name: olist_net

volumes:
  pg_data:
  kafka_data:
  minio_data:
